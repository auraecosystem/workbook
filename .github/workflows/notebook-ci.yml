name: Notebook CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install jupyter

    - name: Execute combined notebook
      run: |
        mkdir -p executed_notebooks
        jupyter nbconvert --to notebook --execute notebook/Notebook.ipynb \
          --ExecutePreprocessor.timeout=600 \
          --output executed_notebooks/executed-Notebook.ipynb

      en:
          background: 
          # 
                    git add requirements.txt .github/workflows/notebook-ci.yml
                     man git-commit -m "Add requirements.txt and notebook CI (execute notebook via nbconvert)"
                     man git-push origin add/requirements-and-notebook-ci
# then open a PR on GitHub from this branch to main
